# Speedrunning Launcher: format, test and build on Linux and Windows, install RSG, Ninjabrain Bot
# and Toolscreen headless on Windows, and publish the Windows build (zip and its SHA-256).
# - A push to `launcher`: the `launcher-latest` prerelease, unsigned. Run by hand with `sign`
#   ticked, the exe is signed through SignPath first.
# - A tag `v<version>` (the `[workspace.package]` version in launcher/Cargo.toml): the release
#   `v<version>`, the one GitHub's `releases/latest` returns and the launcher updates itself from.
#   Signed when SignPath is set up, else unsigned.
# See launcher/README.md.
name: launcher

on:
  push:
    branches: [launcher]
    # Path filters don't apply to tags: every version tag builds.
    tags: ['v*']
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the exe through SignPath (each signing request waits for an approver)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    runs-on: ubuntu-latest
    # A cold cache builds GPUI three times (clippy, tests, release): about 40 minutes.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      # A release tag must name the version the exe reports (Settings, the update check).
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: |
          want=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)".*/\1/p' Cargo.toml | tr -d '\r')
          echo "tag $GITHUB_REF_NAME, workspace version $want"
          [[ "$want" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the workspace version '$want' is not X.Y.Z"; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$want" ] || { echo "::error::tag $GITHUB_REF_NAME doesn't match the workspace version $want (launcher/Cargo.toml)"; exit 1; }

      # GPUI's build needs these (launcher/README.md, "Build").
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev libvulkan1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher -> target

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Release build
        run: cargo build --release --locked -p srl-app

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      # A release tag must name the version the exe reports (Settings, the update check).
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: |
          want=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)".*/\1/p' Cargo.toml | tr -d '\r')
          echo "tag $GITHUB_REF_NAME, workspace version $want"
          [[ "$want" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the workspace version '$want' is not X.Y.Z"; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$want" ] || { echo "::error::tag $GITHUB_REF_NAME doesn't match the workspace version $want (launcher/Cargo.toml)"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher -> target

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

      # Release builds compile GPUI's shaders with fxc.exe and embed its manifest with rc.exe, both
      # from the Windows SDK on windows-latest.
      - name: Release build
        run: cargo build --release --locked -p srl-app

      # SignPath signs only an exe whose version resource names the product (build.rs).
      - name: Version resource
        shell: pwsh
        run: |
          $v = (Get-Item target/release/speedrunning-launcher.exe).VersionInfo
          $v | Format-List ProductName, ProductVersion, FileVersion, FileDescription
          if ($v.ProductName -ne 'Speedrunning Launcher') { throw "ProductName is '$($v.ProductName)'" }

      # The real pipeline without a window: Java, Minecraft 1.16.1, Fabric Loader and the RSG mods
      # into an empty data folder. Fails the job when the install fails (exit code 1). The release
      # exe is a windowed program; bash waits for it and gets its output through the pipe.
      - name: Headless RSG install
        run: |
          export SRL_HOME="$RUNNER_TEMP/srl-home"
          exe=target/release/speedrunning-launcher.exe
          "$exe" --install rsg
          "$exe" --status
          test -n "$(ls "$SRL_HOME/instances/mcsr/mods")"
          du -sh "$SRL_HOME"

      # Ninjabrain Bot and Toolscreen the way the Tools page installs them, into an empty data
      # folder. The launcher prints each installed file with its hash; coreutils hashes the file
      # again, and that hash must be one pinned in srl-tools (Ninjabrain's jar, Toolscreen's DLLs).
      - name: Headless tool installs
        run: |
          export SRL_HOME="$RUNNER_TEMP/srl-tools-home"
          exe=target/release/speedrunning-launcher.exe
          out="$RUNNER_TEMP/tool-installs.txt"
          : > "$out"
          for tool in ninjabrain-bot toolscreen; do
            "$exe" --install-tool "$tool" | tee -a "$out"
          done
          "$exe" --tools
          n=0
          while read -r _ path kind hash; do
            got=$("${kind}sum" "$path" | cut -d' ' -f1)
            got=${got#\\}
            [ "$got" = "$hash" ] || { echo "$path: ${kind} $got, the launcher printed $hash"; exit 1; }
            grep -rqi "$got" crates/srl-tools/src || { echo "$path: ${kind} $got is not pinned in srl-tools"; exit 1; }
            echo "verified ${kind} $path"
            n=$((n + 1))
          done < <(grep '^file ' "$out")
          # Ninjabrain-Bot-1.5.2.jar, Toolscreen.dll and liblogger_x64.dll
          [ "$n" -eq 3 ] || { echo "expected 3 installed files, verified $n"; exit 1; }

      - name: Default data folder
        run: target/release/speedrunning-launcher.exe --status

      # Signing: the tested exe goes to SignPath as an artifact, an approver confirms the request on
      # signpath.io, and the signed exe replaces it before packaging. Needs the SIGNPATH_API_TOKEN secret
      # and the SIGNPATH_ORGANIZATION_ID variable (tools/windows/SIGNPATH.md). A run by hand with
      # `sign` ticked fails without them; a release tag signs when they are set and builds unsigned
      # when they aren't; a push to `launcher` never signs.
      - name: Sign or not
        id: signing
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          ASKED: ${{ inputs.sign }}
        run: |
          configured=yes
          [ -n "$TOKEN" ] || { echo "the SIGNPATH_API_TOKEN secret is not set"; configured=no; }
          [ -n "$ORG" ] || { echo "the SIGNPATH_ORGANIZATION_ID variable is not set"; configured=no; }
          sign=no
          if [ "$ASKED" = true ]; then
            [ "$configured" = yes ] || exit 1
            sign=yes
          elif [ "$GITHUB_REF_TYPE" = tag ] && [ "$configured" = yes ]; then
            sign=yes
          fi
          echo "sign: $sign"
          echo "sign=$sign" >> "$GITHUB_OUTPUT"

      - name: Upload the unsigned exe
        if: steps.signing.outputs.sign == 'yes'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: speedrunning-launcher-unsigned
          path: launcher/target/release/speedrunning-launcher.exe
          if-no-files-found: error

      - name: Sign through SignPath
        if: steps.signing.outputs.sign == 'yes'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'speedrunning-launcher' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # time for an approver to confirm the request
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed

      - name: Use the signed exe
        if: steps.signing.outputs.sign == 'yes'
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signed/speedrunning-launcher.exe'
          $s = Get-AuthenticodeSignature $signed
          $s | Format-List Status, StatusMessage, SignerCertificate
          if ($s.Status -ne 'Valid') { throw "signature: $($s.Status)" }
          Copy-Item $signed target/release/speedrunning-launcher.exe -Force

      - name: Signed or not
        id: signed
        run: echo "signed=${{ steps.signing.outputs.sign }}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          set -x
          rm -rf dist && mkdir -p dist/licenses
          cp target/release/speedrunning-launcher.exe dist/
          cp THIRD_PARTY_NOTICES.md dist/
          cp assets/fonts/*.txt dist/licenses/
          cp assets/icons/LICENSE-lucide.txt dist/licenses/
          sed 's/\r*$/\r/' tools/windows/README.txt > dist/README.txt
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)".*/\1/p' Cargo.toml | tr -d '\r')
          printf 'version %s\ncommit %s\nbuilt %s\nrun %s\nsigned %s\n' "$version" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            "$GITHUB_RUN_ID" "${{ steps.signed.outputs.signed }}" > dist/VERSION.txt
          rm -f speedrunning-launcher-windows.zip
          (cd dist && 7z a -tzip -mx=9 ../speedrunning-launcher-windows.zip . > /dev/null)
          ls -l speedrunning-launcher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: speedrunning-launcher-windows
          path: launcher/speedrunning-launcher-windows.zip
          if-no-files-found: error

  # Only a build that passed on both systems is published. The SHA-256 goes next to the zip in
  # sha256sum's format; the launcher's update checks the zip against it (crates/srl-update).
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: speedrunning-launcher-windows

      - name: Checksum
        run: |
          sha256sum speedrunning-launcher-windows.zip > speedrunning-launcher-windows.zip.sha256
          cat speedrunning-launcher-windows.zip.sha256

      - name: Publish prerelease launcher-latest
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          mb=$(du -m speedrunning-launcher-windows.zip | cut -f1)
          if [ "$SIGNED" = yes ]; then
            signing="The exe is signed. Free code signing provided by SignPath.io, certificate by SignPath Foundation."
          else
            signing="This build is not signed, so Windows SmartScreen may ask: choose More info, then Run anyway."
          fi
          notes="Windows test build of Speedrunning Launcher.

          Download speedrunning-launcher-windows.zip (${mb} MB), unzip it and run speedrunning-launcher.exe. README.txt in the zip says where the data and logs are.

          ${signing}

          Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}."
          if gh release view launcher-latest > /dev/null 2>&1; then
            # move the tag to this commit, then replace the assets
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/launcher-latest" -f sha="${GITHUB_SHA}" -F force=true > /dev/null \
              || echo "warning: could not move tag launcher-latest"
            gh release upload launcher-latest speedrunning-launcher-windows.zip speedrunning-launcher-windows.zip.sha256 --clobber
            gh release edit launcher-latest --prerelease --title "Launcher test build (latest)" --notes "$notes"
          else
            gh release create launcher-latest speedrunning-launcher-windows.zip speedrunning-launcher-windows.zip.sha256 \
              --prerelease --target "${GITHUB_SHA}" --title "Launcher test build (latest)" --notes "$notes"
          fi
          gh release view launcher-latest --json url,assets --jq '.url, (.assets[] | .url)'

      # A normal release (not a prerelease), marked latest: `releases/latest` returns it, so every
      # installed launcher finds it on its next start.
      - name: Publish release ${{ github.ref_name }}
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ needs.windows.outputs.signed }}
          TAG: ${{ github.ref_name }}
        run: |
          mb=$(du -m speedrunning-launcher-windows.zip | cut -f1)
          if [ "$SIGNED" = yes ]; then
            signing="The exe is signed. Free code signing provided by SignPath.io, certificate by SignPath Foundation."
          else
            signing="This build is not signed, so Windows SmartScreen may ask the first time: choose More info, then Run anyway."
          fi
          notes="Speedrunning Launcher ${TAG#v} for Windows 10 and 11 (x64).

          New here: download speedrunning-launcher-windows.zip (${mb} MB), unzip it and run speedrunning-launcher.exe. README.txt in the zip says where the data and logs are.

          Already have it: the launcher finds this version on its next start, installs it and asks you to restart (Settings, About).

          ${signing} SHA-256: $(cut -d' ' -f1 speedrunning-launcher-windows.zip.sha256)

          Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}."
          files=(speedrunning-launcher-windows.zip speedrunning-launcher-windows.zip.sha256)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --prerelease=false --draft=false --latest --title "Speedrunning Launcher ${TAG#v}" --notes "$notes"
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --latest --title "Speedrunning Launcher ${TAG#v}" --notes "$notes"
          fi
          gh release view "$TAG" --json url,isPrerelease,assets --jq '.url, .isPrerelease, (.assets[] | .url)'
