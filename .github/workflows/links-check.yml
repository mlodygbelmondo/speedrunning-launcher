name: Learn links check

on:
  schedule:
    # Weekly on Monday at 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learn-links:
    name: Learn guide links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Learn links
        run: bash launcher/tools/check-learn-links.sh
