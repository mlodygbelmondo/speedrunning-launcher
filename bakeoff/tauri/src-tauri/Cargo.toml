[package]
name = "bakeoff-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bakeoff-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
