[package]
name = "srl-game"
description = "Minecraft itself: version metadata, libraries, assets, Java runtimes, Fabric Loader and starting the game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
srl-core.workspace = true
anyhow.workspace = true
futures.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_System_Threading"] }
