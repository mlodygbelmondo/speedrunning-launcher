[package]
name = "srl-update"
description = "Self-update for Speedrunning Launcher: the GitHub release check, the verified download and staging, and swapping the exe"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
srl-core.workspace = true
# The zip-slip guard for entry names (`archive::safe_relative`), shared with the practice maps.
srl-practice.workspace = true
anyhow.workspace = true
reqwest.workspace = true
# Release tags against the running version. Already in the build through gpui.
semver = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zip.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread"] }
httparse = "1"
sha2.workspace = true
hex.workspace = true
